<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Mela TikTok auth</title>
<style>body{font-family:system-ui;max-width:640px;margin:80px auto;padding:0 20px;color:#3A201A;background:#FDF9F9}code{display:block;padding:14px;background:#fff;border:1px solid #e5d5d5;border-radius:10px;word-break:break-all;margin-top:12px;font-size:15px}</style>
</head>
<body>
<h2>Mela TikTok authorization</h2>
<p>Authorization code (paste it back into the terminal):</p>
<code id="c">no code in URL</code>
<script>
const p = new URLSearchParams(location.search);
if (p.get("code")) document.getElementById("c").textContent = p.get("code");
</script>
</body>
</html>
